name: Zenodo metadata sync

# The published record can be edited by hand on zenodo.org (Edit -> Publish, which
# makes no new version). This pulls that record back into .zenodo.json so the deposit
# metadata the next release would use never drifts from what people are reading.

on:
  schedule:
    - cron: "17 5 1 * *"        # 05:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zenodo-metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the published record into .zenodo.json
        run: python3 case/scripts/sync_zenodo_metadata.py

      - name: Commit the change, if the record moved
        run: |
          if git diff --quiet -- .zenodo.json; then
            echo "in sync — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .zenodo.json
          git commit -m "Sync .zenodo.json with the published Zenodo record"
          git push
