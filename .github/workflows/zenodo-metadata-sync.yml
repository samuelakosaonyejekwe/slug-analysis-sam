name: Zenodo metadata sync

# Zenodo has no outbound webhook, so a hand edit to the published record can only be
# noticed by polling. This runs at GitHub's minimum schedule interval (5 min), reads
# the record through the public API, and commits .zenodo.json only when it has moved.
#
# The checkout is sparse — the script and the one file it writes — because the repo
# carries a 13 MB report.pdf and a large figure set that a 5-minute job has no reason
# to clone.

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes: GitHub's floor. Scheduled runs are
                               # queued, not guaranteed, and are delayed under load.
  workflow_dispatch:           # Actions tab -> Run workflow, when you want it now
  push:                        # also keeps the schedule alive: GitHub disables
    branches: [main]           # scheduled workflows after 60 idle days

permissions:
  contents: write

concurrency:
  group: zenodo-metadata-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            case/scripts/sync_zenodo_metadata.py
            .zenodo.json
          sparse-checkout-cone-mode: false

      - name: Pull the published record into .zenodo.json
        run: python3 case/scripts/sync_zenodo_metadata.py

      - name: Commit the change, if the record moved
        run: |
          if git diff --quiet -- .zenodo.json; then
            echo "in sync — nothing to commit"
            exit 0
          fi
          #  Commit as the repository owner, not as the Actions bot. The bot otherwise
          #  appears in the GitHub contributor list for a job that only mirrors metadata
          #  the owner published on Zenodo by hand -- it authors nothing.
          git config user.name  "Akosa Samuel Onyejekwe"
          git config user.email "samuelonyejekwe852@gmail.com"
          git add .zenodo.json
          git commit -m "Sync .zenodo.json with the published Zenodo record"
          git push
