[project]
name = "shct-solver"
version = "4.0.0"
description = "SHCT transient coupled-PDE solver for subsea slug + hydrate flow assurance"
authors = [{ name = "Akosa Samuel Onyejekwe" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
calibrate = ["scipy>=1.10,<2"]
plots = ["matplotlib>=3.6,<4"]
dev = ["ruff>=0.4", "mypy>=1.8", "pytest>=8.0"]
#  The document toolchain. requirements.txt covers the SOLVER, and used to be the only
#  manifest -- but README's "Regenerating every tracked output" ends with build_report.py,
#  which does `from docx.shared import RGBColor` at module level, and report.pdf is a
#  TRACKED artefact. A clean checkout that followed the documented steps stopped there with
#  ModuleNotFoundError. check_docs.py needs python-pptx as well, and check_outputs.py Pillow.
report = [
    "python-docx>=1.1,<2",     # build_report.py, build_reports.py, check_docs.py
    "python-pptx>=1.0,<2",     # check_docs.py, check_slides.py, the deck scripts
    "pillow>=10.0",            # check_outputs.py, the artwork checks, the GIF writer
    "reportlab>=4.0",          # docx2pdf_native.py — the .docx -> .pdf renderer
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pragmatic set for a numerics module: pyflakes (F), pycodestyle (E/W), bugbear (B),
# comprehensions (C4), isort (I). E501 long-line is handled by line-length above.
select = ["F", "E", "W", "B", "C4", "I"]
ignore = [
    "E741",   # ambiguous variable names (i, l) are idiomatic in discretised PDE loops
    "E226",   # missing whitespace around arithmetic — dense math is intentional
    "B905",   # zip(..., strict=...) not required on >=3.10 targets here
    #  The three below fired ~700 times between them, on deliberate house style, and
    #  buried the ~70 findings that were real. An advisory lint that reports 1100 hits
    #  is not read, which is the same as not running it.
    "E701",   # `if x: return` and `a = b; c = d` guard clauses — deliberate, dense numerics
    "E702",   # compound statements on one line (paired assignments of related fields)
    "E401",   # `import os, math` — the module headers group stdlib imports on one line
    "E402",   # imports after code: matplotlib.use("Agg") and the _ttl helper must precede
              # `import matplotlib.pyplot`, and the data model is imported after the banner
]

[tool.ruff.lint.per-file-ignores]
"test_solver.py" = ["E501"]

[tool.mypy]
#  NO python_version PIN. It was "3.10", which told mypy to parse every file — including
#  the stubs of the INSTALLED numpy — under 3.10 syntax. NumPy 2.3's own __init__.pyi uses
#  a PEP 695 `type` statement, which is 3.12-only, so the 3.12 CI job died on
#  `numpy/__init__.pyi:737: Type statement is only supported in Python 3.12 and greater`
#  before it checked a single line of this project. CI had been red on that since v3.4.0.
#  Unpinned, each job checks under its own interpreter: the 3.10 job resolves numpy <= 2.2,
#  whose stubs parse under 3.10, and the 3.12 job parses 3.12 stubs as 3.12.
ignore_missing_imports = true      # numpy/scipy/matplotlib stubs optional
warn_unused_ignores = true
warn_redundant_casts = true
# the solver is numpy-array heavy; full strictness is not the goal — catch real type errors only
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-q"
python_files = "test_*.py"
